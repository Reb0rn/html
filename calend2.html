<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Планирование отпусков</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; gap: 20px; margin: 20px; }
    #leftPanel { width: 260px; }
    #rightPanel { flex: 1; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; vertical-align: top; }
    th { background: #f0f0f0; }
    .btn { padding: 6px 12px; margin-top: 10px; cursor: pointer; }
    .overlimit { color: red; font-weight: bold; }
    .bold { font-weight: bold; }

    /* Календарь */
    #calendar { display: none; margin-top: 20px; }
    .calendar-title { margin: 0 0 10px 0; }
    .calendar-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .month { border: 1px solid #ccc; padding: 3px; font-size: 10px; }
    .month h4 { text-align: center; margin: 2px 0; font-size: 11px; text-transform: capitalize; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 1px; }
    .dow { font-weight: bold; padding: 2px 0; font-size: 10px; border: 1px solid #ddd; }
    .day { position: relative; padding: 2px 0; min-height: 16px; font-size: 10px; border: 1px solid #ddd; }
    .weekend { color: red; font-weight: bold; }
    .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin: 0 1px; }
    .dot-container { position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; }
  </style>
</head>
<body>
  <!-- Левая панель -->
  <div id="leftPanel">
    <h3>Добавить сотрудника</h3>
    <input type="text" id="surname" placeholder="Фамилия" /><br /><br />
    <label>Начало отпуска:</label><br />
    <input type="date" id="startDate" /><br /><br />
    <label>Конец отпуска:</label><br />
    <input type="date" id="endDate" /><br /><br />
    <button class="btn" id="addPeriodBtn">Добавить период</button>

    <!-- Блок добавления праздника -->
    <br /><br />
    <label>Дата праздника:</label><br />
    <input type="date" id="holidayDate" /><br />
    <button class="btn" id="addHolidayBtn" style="font-size:10px;padding:2px 6px;">Добавить праздник</button>
  </div>

  <!-- Правая панель -->
  <div id="rightPanel">
    <h3>
      Таблица отпусков
      <select id="yearSelect">
        <option value="2024">2024</option>
        <option value="2025" selected>2025</option>
        <option value="2026">2026</option>
      </select>
    </h3>

    <table id="vacationTable">
      <thead>
        <tr>
          <th style="background:#eee;">Фамилия</th>
          <th>Янв</th><th>Фев</th><th>Мар</th><th>Апр</th>
          <th>Май</th><th>Июн</th><th>Июл</th><th>Авг</th>
          <th>Сен</th><th>Окт</th><th>Ноя</th><th>Дек</th>
          <th>Итого</th><th>Удалить</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button class="btn" id="toggleCalendarBtn">Показать календарь</button>
    <div id="calendar"></div>
  </div>

  <script>
    // Состояние
    let users = {};
    const colors = ["#ff9999","#99ccff","#99ff99","#ffcc99","#cc99ff","#66cccc","#ff9966","#cccc66","#66cc99","#ff66cc"];
    let colorIndex = 0;
    let currentYear = 2025;

    // Праздники: можно хранить стандартные и добавлять свои
    const holidays = {
      2024: ["2024-01-01","2024-03-08","2024-05-09","2024-07-03","2024-12-25"],
      2025: ["2025-01-01","2025-03-08","2025-05-09","2025-07-03","2025-12-25"],
      2026: ["2026-01-01","2026-03-08","2026-05-09","2026-07-03","2026-12-25"]
    };

    // Утилиты
    function formatISO(d) {
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const yyyy = d.getFullYear();
      return `${yyyy}-${mm}-${dd}`;
    }
    function formatHuman(iso) {
      const d = new Date(iso);
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const yyyy = d.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }
    function saveData() { localStorage.setItem("vacationsData", JSON.stringify(users)); }
    function loadData() {
      const saved = localStorage.getItem("vacationsData");
      if (saved) { users = JSON.parse(saved); colorIndex = Object.keys(users).length; }
    }

    // Таблица
    function renderTable() {
      const tbody = document.querySelector("#vacationTable tbody");
      tbody.innerHTML = "";
      for (const [surname, data] of Object.entries(users)) {
        const months = data.periods?.[currentYear] || Array(12).fill(0).map(() => []);
        const total = months.reduce((s, arr) => s + arr.length, 0);
        const tr = document.createElement("tr");
        tr.style.backgroundColor = data.color;

        let cells = "";
        months.forEach(arr => {
          if (arr.length > 0) {
            const first = formatHuman(arr[0]);
            const last = formatHuman(arr[arr.length - 1]);
            cells += `<td><span class="bold">${arr.length}</span> (${first}–${last})</td>`;
          } else {
            cells += `<td>-</td>`;
          }
        });

        const totalClass = total > 31 ? "overlimit" : "bold";
        tr.innerHTML = `
          <td style="background:#eee;">${surname}</td>
          ${cells}
          <td class="${totalClass}">${total}</td>
          <td><button class="btn btn-del" data-surname="${surname}">Удалить</button></td>
        `;
        tbody.appendChild(tr);
      }

      document.querySelectorAll(".btn-del").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const sn = e.currentTarget.getAttribute("data-surname");
          delete users[sn];
          saveData();
          renderTable();
          refreshCalendarDots();
        });
      });
    }

    // Календарь
    function generateCalendar(year) {
      const container = document.getElementById("calendar");
      container.innerHTML = `<h3 class="calendar-title">Календарь ${year}</h3><div class="calendar-container"></div>`;
      const cal = container.querySelector(".calendar-container");

      for (let m = 0; m < 12; m++) {
        const date = new Date(year, m, 1);
        const monthName = date.toLocaleString("ru-RU", { month: "long" });
        const monthDiv = document.createElement("div");
        monthDiv.className = "month";
        monthDiv.innerHTML = `<h4>${monthName}</h4><div class="days"></div>`;
        const daysDiv = monthDiv.querySelector(".days");

        // Заголовки
        ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach((d, idx) => {
          const dow = document.createElement("div");
          dow.className = "dow";
          if (idx >= 5) dow.classList.add("weekend");
          dow.textContent = d;
          daysDiv.appendChild(dow);
        });

        // Пустые до первого дня (понедельник=0)
        let startDay = (date.getDay() + 6) % 7;
        for (let i = 0; i < startDay; i++) {
          const empty = document.createElement("div");
          empty.className = "day";
          daysDiv.appendChild(empty);
        }

        // Дни месяца
        while (date.getMonth() === m) {
          const cell = document.createElement("div");
          cell.className = "day";
          const dow = (date.getDay() + 6) % 7;
          if (dow >= 5) cell.classList.add("weekend");
          const iso = formatISO(date);
          cell.setAttribute("data-date", iso);
          cell.textContent = String(date.getDate());
		  cell.style.fontSize = "14px"; 

          // Праздники — жирным
          if (holidays[year]?.includes(iso)) {
            cell.style.fontWeight = "bold";
			cell.style.fontSize = "18px"; 
			cell.style.color = "violet";
          }

          // Контейнер для точек
          const dots = document.createElement("div");
          dots.className = "dot-container";
          cell.appendChild(dots);
		  	

          daysDiv.appendChild(cell);
          date.setDate(date.getDate() + 1);
        }

        cal.appendChild(monthDiv);
      }
    }

    function refreshCalendarDots() {
      const container = document.getElementById("calendar");
      if (container.style.display !== "block") return;

      // очистить точки
      container.querySelectorAll(".dot-container").forEach(dc => { dc.innerHTML = ""; });

      // нарисовать точки
      for (const [surname, data] of Object.entries(users)) {
        const months = data.periods?.[currentYear] || [];
        months.forEach(arr => {
          arr.forEach(iso => {
            const cell = container.querySelector(`.day[data-date="${iso}"]`);
            if (cell) {
              const dc = cell.querySelector(".dot-container");
              const dot = document.createElement("span");
              dot.className = "dot";
              dot.style.backgroundColor = data.color;
			   dot.title = surname;
              dc.appendChild(dot);
            }
          });
        });
      }
    }

    // Действия
    function addPeriod() {
      const surnameEl = document.getElementById("surname");
      const startEl = document.getElementById("startDate");
      const endEl = document.getElementById("endDate");

      const surname = surnameEl.value.trim();
      const start = new Date(startEl.value);
      const end = new Date(endEl.value);

      if (!surname || !startEl.value || !endEl.value ||
          Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) {
        alert("Введите корректные данные!");
        return;
      }

      if (!users[surname]) {
        users[surname] = { color: colors[colorIndex % colors.length], periods: {} };
        colorIndex++;
      }
      if (!users[surname].periods?.[currentYear]) {
        users[surname].periods[currentYear] = Array(12).fill(0).map(() => []);
      }

      let cur = new Date(start);
      while (cur <= end) {
        if (cur.getFullYear() === currentYear) {
          const month = cur.getMonth();
          users[surname].periods[currentYear][month].push(formatISO(cur));
        }
        cur.setDate(cur.getDate() + 1);
      }

      saveData();
      renderTable();
      refreshCalendarDots();

      startEl.value = "";
      endEl.value = "";
    }

    function toggleCalendar() {
      const calDiv = document.getElementById("calendar");
      if (calDiv.style.display === "block") {
        calDiv.style.display = "none";
      } else {
        calDiv.style.display = "block";
        generateCalendar(currentYear);
        refreshCalendarDots();
      }
    }

    function changeYear(newYear) {
      currentYear = Number(newYear);
      renderTable();
      const calDiv = document.getElementById("calendar");
      if (calDiv.style.display === "block") {
        generateCalendar(currentYear);
        refreshCalendarDots();
      }
    }

    // Добавление одного праздника из поля даты
    function addHoliday() {
      const input = document.getElementById("holidayDate");
      if (!input.value) {
        alert("Выберите дату праздника");
        return;
      }
      const d = new Date(input.value);
      const iso = formatISO(d);
      const y = d.getFullYear();

      // инициализация массива для года, если нет
      if (!holidays[y]) holidays[y] = [];
      // добавить, если не дублируется
      if (!holidays[y].includes(iso)) holidays[y].push(iso);

      // если выбранный год соответствует — перерисуем календарь
      const calDiv = document.getElementById("calendar");
      if (calDiv.style.display === "block") {
        generateCalendar(currentYear);
        refreshCalendarDots();
      }
      input.value = "";
    }

    // Инициализация
    document.addEventListener("DOMContentLoaded", () => {
      loadData();
      const yearSelect = document.getElementById("yearSelect");
      currentYear = Number(yearSelect.value);

      renderTable();

      document.getElementById("addPeriodBtn").addEventListener("click", addPeriod);
      document.getElementById("toggleCalendarBtn").addEventListener("click", toggleCalendar);
      document.getElementById("addHolidayBtn").addEventListener("click", addHoliday);
      yearSelect.addEventListener("change", (e) => changeYear(e.target.value));
    });
  </script>
</body>
</html>
